<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sinentropy</title>
<link rel="stylesheet" href="style.css">
<script src="src/palette.js"></script>
</head>
<body>
<main>
<section class="pane" data-title="sinentropy">
  <p class="intro">Additive synthesis in the browser: sum sine oscillators shaped by
    envelopes, and watch the spectral entropy of the result update live.</p>
  <p class="manual-link"><a class="tui-btn" href="manual.html" target="_blank" rel="noopener">[ Manual ]</a></p>
  <div class="tracks">
    <div class="track">
      <h2 class="track-title">Track A</h2>
      <textarea id="code" spellcheck="false" rows="28"># alias ~/^, inviluppo opzionale, modulazione annidata su tutti e 4 i parametri

# FM: il carrier e' modulato in frequenza da un altro oscillatore
~(220 + ~(5,80,0), 0.4, 0) * ^(0, 0.05,1, 3,0.6, 1,0)

# AM/tremolo: l'ampiezza oscilla nel tempo
~(440, 0.25 + ~(6,0.15,0), 0) * ^(0, 0.05,1, 3,0.5, 1,0)

# drone senza inviluppo: sostiene finche' non premi Stop
~(110, 0.12, 0, -0.6)

# modulazione profonda: freq, amp, phase e pan hanno ciascuno il proprio oscillatore
~(~(3,30,0)+180, ~(2,0.1,0)+0.2, ~(1,1,0), ~(0.5,1,0)) * ^(0, 0.3,1, 4,0.4, 2,0)

# scrivi ~~ per Run, !! per Stop, in un punto qualsiasi del codice</textarea>
      <div class="controls">
        <button id="run" class="tui-btn">[ Run ]</button>
        <button id="stop" class="tui-btn">[ Stop ]</button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
    <div class="track">
      <h2 class="track-title">Track B</h2>
      <textarea id="code2" spellcheck="false" rows="28"># seconda traccia indipendente: la sua Run/Stop non tocca la Track A

# un arpeggio con un ciclo for dentro un overlap
overlap(0.12) {
  for i in 1..4 {
    sin(220*i, 0.2, 0) * env(0, 0.01,1, 0.2,0)
  }
}

# scrivi ~~ per Run, !! per Stop, in un punto qualsiasi del codice</textarea>
      <div class="controls">
        <button id="run2" class="tui-btn">[ Run ]</button>
        <button id="stop2" class="tui-btn">[ Stop ]</button>
      </div>
      <div class="status" id="status2" aria-live="polite"></div>
    </div>
  </div>
  <div class="entropy-line">spectral entropy: <span id="entropy">0.0000</span></div>
  <div class="viz-row">
    <canvas id="spectrum" width="600" height="240" aria-hidden="true"></canvas>
    <canvas id="waveform" width="600" height="240" aria-hidden="true"></canvas>
  </div>
</section>
</main>
<script src="src/lang/tokenizer.js"></script>
<script src="src/lang/parser.js"></script>
<script src="src/lang/compiler.js"></script>
<script src="src/lang/interpreter.js"></script>
<script src="src/audio/playback-state.js"></script>
<script src="src/audio/engine.js"></script>
<script src="src/audio/visualizer.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
